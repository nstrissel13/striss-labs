</style></head><body><div id="app"></div><script>
// ===================== CHEM//QUEST core: utils, crypto, Excel reader, gradebook parser =====================
const enc=new TextEncoder(),dec=new TextDecoder();
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>String(Number((+x).toFixed(2)));
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=u8=>b64(u8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const hex=u8=>[...u8].map(b=>b.toString(16).padStart(2,'0')).join('');
const sha=async s=>new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)));
const rndKey=()=>b64u(crypto.getRandomValues(new Uint8Array(16)));           // 128-bit random key, 22 characters
const idOf=async k=>hex((await sha('id:'+k)).slice(0,12));                    // public lookup id (cannot be reversed to the key)
const aesKey=async k=>crypto.subtle.importKey('raw',await sha('enc:'+k),'AES-GCM',false,['encrypt','decrypt']);
async function seal(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(key),enc.encode(JSON.stringify(obj))));return{id:await idOf(key),iv:b64(iv),ct:b64(ct)}}
async function unseal(key,blob){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},await aesKey(key),unb64(blob.ct));return JSON.parse(dec.decode(pt))}catch(e){return null}}
const norm=s=>String(s==null?'':s).trim().replace(/\s+/g,' ').toLowerCase();
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

// ---------- minimal .xlsx reader (zip + XML), cached values only ----------
async function readZip(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);let e=u8.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('This does not look like an Excel (.xlsx) file.');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('The Excel file is damaged.');
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lho=dv.getUint32(p+42,true);
    files[dec.decode(u8.subarray(p+46,p+46+nl))]={method,csize,lho};p+=46+nl+el+cl;
  }
  return async name=>{
    const f=files[name];if(!f)return null;const lp=f.lho,start=lp+30+dv.getUint16(lp+26,true)+dv.getUint16(lp+28,true),data=u8.subarray(start,start+f.csize);
    if(f.method===0)return data;
    if(f.method!==8)throw new Error('Unsupported compression in the Excel file.');
    return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  };
}
const xml=u8=>new DOMParser().parseFromString(dec.decode(u8),'application/xml');
const colIdx=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n-1};
async function readSheets(buf,wanted){
  const get=await readZip(buf);
  const wbx=xml(await get('xl/workbook.xml')),rels=xml(await get('xl/_rels/workbook.xml.rels'));
  const target={};for(const r of rels.getElementsByTagName('Relationship'))target[r.getAttribute('Id')]=r.getAttribute('Target');
  const sstU8=await get('xl/sharedStrings.xml'),sst=[];
  if(sstU8)for(const si of xml(sstU8).getElementsByTagName('si')){let t='';for(const x of si.getElementsByTagName('t'))if(x.parentNode.nodeName!=='rPh')t+=x.textContent;sst.push(t)}
  const out={};
  for(const sh of wbx.getElementsByTagName('sheet')){
    const name=sh.getAttribute('name');if(wanted&&!wanted.includes(name))continue;
    let path=target[sh.getAttribute('r:id')];if(!path)continue;path=path.startsWith('/')?path.slice(1):'xl/'+path;
    const data=await get(path);if(!data)continue;
    const rows=[];
    for(const row of xml(data).getElementsByTagName('row')){
      for(const c of row.getElementsByTagName('c')){
        const m=/^([A-Z]+)(\d+)$/.exec(c.getAttribute('r')||'');if(!m)continue;const ci=colIdx(m[1]),ri=+m[2]-1,t=c.getAttribute('t');
        let v=null;const ve=c.getElementsByTagName('v')[0];
        if(t==='inlineStr'){v='';for(const x of c.getElementsByTagName('t'))v+=x.textContent}
        else if(ve){const s=ve.textContent;v=t==='s'?sst[+s]:t==='str'?s:t==='b'?s==='1':t==='e'?null:Number(s)}
        if(v===null)continue;(rows[ri]||(rows[ri]=[]))[ci]=v;
      }
    }
    let w=0;for(const r of rows)if(r&&r.length>w)w=r.length;
    out[name]=Array.from({length:rows.length},(_,i)=>Array.from({length:w},(_,j)=>(rows[i]&&rows[i][j]!==undefined)?rows[i][j]:null));
  }
  return out;
}

// ---------- gradebook parser (mirrors the gradebook's own rules) ----------
const CFG={
  ranks:[[0,'Cadet'],[3,'Lab Assistant'],[6,'Analyst'],[9,'Reaction Specialist'],[12,'Chemist'],[16,'Principal Investigator']],   // placeholder titles
  units:{1:'Foundations',2:'Matter & Energy',3:'Measurement'},
  badges:[['Origins','origins',0],['Worldview','worldview',0],['Foundations','foundations',1],['Star Dust','stardust',0],['Matter & Energy','matter',1],['Baker','baker',0],['Measurement','measurement',1]]
};
const SHEETS=['Classes','Decaying Average','EXP DASHBOARD','Do Now Dashboard','Badges'],OPTIONAL=['Ranks','Goals'];
const num=x=>typeof x==='number'&&isFinite(x)?x:null;
function dispName(full){const p=String(full).trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1][0].toUpperCase()+'.':p[0]}
function parseGradebook(S){
  for(const n of SHEETS)if(!S[n])throw new Error(`The workbook has no sheet named "${n}".`);
  const warn=[];let RK=null;
  if(S.Ranks){const t=[];for(const r of S.Ranks.slice(1)){const l=num(r&&r[0]),n=r&&r[1]!=null?String(r[1]).trim():'';if(l!=null&&n)t.push([Math.max(0,Math.floor(l)),n])}
    t.sort((a,b)=>a[0]-b[0]);if(t.length){if(t[0][0]>0)t.unshift([0,CFG.ranks[0][1]]);RK=t}else warn.push('The Ranks sheet has no usable rows (need Level in column A and Title in column B); using the default titles.')}
  const GOALS=[];
  if(S.Goals){for(const r of S.Goals.slice(1)){if(!r||r.every(x=>x==null||x===''))continue;
    const mt=String(r[2]||'').toLowerCase(),metric=/exp/.test(mt)?'exp':/master/.test(mt)?'mastered':/prof/.test(mt)?'prof':null,tg=num(r[3]);
    if(!metric||tg==null||tg<=0){warn.push(`Goals sheet: skipped a row (Tier "${r[1]??''}"). Metric must be EXP, Mastered or Proficient and Target must be a number.`);continue}
    GOALS.push({p:r[0]==null||r[0]===''?'':String(r[0]).trim(),tier:String(r[1]??'').trim(),metric,target:tg,reward:String(r[4]??'').trim()})}}
  const {Classes:cl,'Decaying Average':da,'EXP DASHBOARD':ex,'Do Now Dashboard':dn,Badges:bd}=S;
  const W=num((da[1]||[])[4]),PRO=num((da[2]||[])[3]),MAXS=num((da[2]||[])[4]);
  if(W==null||PRO==null||MAXS==null)throw new Error('Could not find the weight factor / proficiency range on Decaying Average (E2, D3, E3).');
  const rate={};for(let i=1;i<=6;i++){const r=ex[i]||[];if(r[9]!=null)rate[r[9]]=num(r[10])}
  const R={pro:rate['Pro'],mas:rate['Master'],dn:rate['Do Now'],lvl:rate['/ Lvl']};
  if(Object.values(R).some(v=>v==null))throw new Error('Could not read the EXP rates on EXP DASHBOARD (J2:K7).');
  const r4=da[3]||[],r6=da[5]||[],r7=da[6]||[],r8=da[7]||[];
  const lessons=[];for(let c=0;c<r6.length;c++)if(r6[c]==='Attempt')lessons.push({s:c,id:String(r6[c+3]??''),name:String(r7[c+3]??'')});
  if(!lessons.length)throw new Error('No ProCheck attempt columns were found on Decaying Average (row 6 should say "Attempt").');
  const labs=[];
  for(let c=0;c<r6.length;c++)if(r6[c]==='Lab'){let e=c+1;while(e<r8.length&&r8[e]!=='Lab')e++;
    if(e>=r8.length){warn.push('A Lab section has no overall "Lab" column and was skipped.');continue}
    labs.push({kind:'group',id:String(r6[e]??''),name:String(r7[e]??''),overall:e,of:num(r4[e]),parts:Array.from({length:e-c},(_,k)=>({n:String(r8[c+k]??''),c:c+k,max:num(r4[c+k])}))})}
  for(let c=0;c<r8.length;c++)if(typeof r8[c]==='string'&&/^Lab\s*:/i.test(r8[c]))labs.push({kind:'single',id:String(r6[c]??''),name:r8[c].replace(/^Lab\s*:\s*/i,'').trim(),c});
  labs.sort((a,b)=>(a.kind==='group'?a.parts[0].c:a.c)-(b.kind==='group'?b.parts[0].c:b.c));
  const gh=String(r8[6]||'').toLowerCase();if(!gh.startsWith('prof')||!String(r8[7]||'').toLowerCase().startsWith('master'))warn.push('Columns G and H on Decaying Average no longer look like Proficient / Mastered counts. EXP may be wrong.');
  // lookups by normalized name
  const daRow={};for(let i=8;i<da.length;i++){const n=da[i]&&da[i][0];if(typeof n==='string'&&n.trim()&&n!=='Student')daRow[norm(n)]=da[i]}
  const dnRow={};for(let i=5;i<dn.length;i++){const n=dn[i]&&dn[i][0];if(typeof n==='string'&&n.trim())dnRow[norm(n)]=dn[i]}

async function buildData(P,tkey,knownKeys){

    trec.push({name:s.name,disp:s.rec.n,period:s.period,key,nodata:s.rec.nodata,total:s.rec.total||0,lvl:s.rec.lvl||900,
      st:L.map(l=>l.st),labs:(s.rec.labs||[]).map(l=>l.st),mastered:cnt('mastered'),proficient:cnt('proficient'),attention:cnt('retake')+cnt('below'),none:cnt('none')});
  }
  const teacher={built:P.built,students:trec,meta:P.meta};
  return{data:{v:2,built:P.built,c:Object.assign({built:P.built},P.cls),s:shuffle(blobs),t:await seal(tkey,teacher)},keys};
}

const CHIP={mastered:['MASTERED','gd'],proficient:['PROFICIENT','cy'],retake:['RETAKE NEEDED','or'],below:['BELOW PROFICIENT','or'],none:['NOT STARTED','gr']};
const LCHIP={complete:['COMPLETE','cy'],progress:['IN PROGRESS','or'],none:['NOT STARTED','gr']};
const tierOf=(v,R)=>v>=R.max?'gd':v>=R.pro?'cy':'or';
const barH=(v,cls,max,pro)=>`<span class="bar"><i class="${cls}" style="width:${Math.min(100,Math.max(0,v/max*100)).toFixed(0)}%"></i>${pro!=null?`<b style="left:${(pro/max*100).toFixed(0)}%"></b>`:''}</span>`;
function explain(l,R){const a=l.att;
  if(!a.length)return'You have not attempted this ProCheck yet. Your attempts will appear here.';
  if(l.st==='retake')return`Your latest attempt (${fmt(a[a.length-1])}) is below the proficiency line of ${fmt(R.pro)}, so this ProCheck needs a retake. New attempts will be added here.`;
  if(l.st==='mastered'||l.st==='proficient')return`Your best attempt (${fmt(l.best)}) decides whether you are Proficient or Mastered.`;
  return`Your best attempt (${fmt(l.best)}) is below the proficiency line of ${fmt(R.pro)}.`}
function lessonH(l,R){
  const [chip,cc]=CHIP[l.st],a=l.att,nm=l.name?`<em>${E(l.name)}</em>`:'';
  const head=`<span class="lid">${E(l.id)}${nm}</span><span class="chip ${cc}">${chip}</span><span class="sc">${l.score==null?'—':fmt(l.score)}</span>${l.score!=null?barH(l.score,tierOf(l.best,R),R.max,R.pro):'<span class="bar"></span>'}`;
  if(!a.length)return`<details class="ls"><summary>${head}<span class="chev"></span></summary><div class="bd"><p>${E(explain(l,R))}</p></div></details>`;
  const at=a.map((v,i)=>`<li><span class="an">Attempt ${i+1}</span>${barH(v,tierOf(v,R),R.max,R.pro)}<span class="atv ${tierOf(v,R)}">${fmt(v)}</span></li>`).join('');
  return`<details class="ls"><summary>${head}<span class="chev"></span></summary><div class="bd"><div class="lab">YOUR ATTEMPTS (out of ${fmt(R.max)})</div><ul class="at">${at}</ul><p>${E(explain(l,R))}</p></div></details>`}
function labH(lb){
  const [chip,cc]=LCHIP[lb.st],nm=lb.name?`<em>${E(lb.name)}</em>`:'';
  if(lb.single){
    const head=`<span class="lid">${E(lb.id)}${nm}</span><span class="chip ${cc}">${chip}</span><span class="sc">${lb.v==null?'—':fmt(lb.v)}</span><span class="bar"></span>`;

async function ghReq(method,c,body,raw){
  const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}${method==='GET'?'?ref='+encodeURIComponent(c.branch):''}`,
    {method,headers:{Authorization:'Bearer '+c.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401)throw new Error('GitHub did not accept the token. It may be wrong or expired. Create a new one and save it again.');
  if(r.status===403)throw new Error('The token is not allowed to do that. Check that it has "Contents: Read and write" for this repository.');
  if(r.status===404&&method==='GET')return null;
  if(r.status===404)throw new Error('GitHub could not find that repository, or the token cannot reach it. Check the owner and repository name.');
  if(!r.ok){const e=new Error('GitHub returned an error ('+r.status+').');e.status=r.status;throw e}

  const labs=T.meta.labs.map((l,i)=>{const d=st.filter(s=>s.labs[i]==='complete').length,p=n?Math.round(d/n*100):0;return`<div class="lr"><b>${E(l.id)}</b><span>${E(l.name||'Lab')} <small>(lab)</small></span><span class="bar"><i class="gd" style="width:${p}%"></i></span><em>${p}% · ${d} / ${n} complete</em></div>`}).join('');
  const att=st.filter(s=>s.attention).map(s=>`${E(s.name)}: ${T.meta.lessons.filter((l,i)=>s.st[i]==='retake'||s.st[i]==='below').map(l=>E(l.id)).join(', ')}`);
  return`<section class="pn"><h2>CLASS PROGRESS<small>${n} STUDENTS WITH SCORES</small></h2><div class="bar-row"><label>Period <select id="per"><option value="all">All</option>${periods.map(p=>`<option value="${E(p)}" ${String(p)===S.period?'selected':''}>${E(p)}</option>`).join('')}</select></label></div>${n?rows+labs:'<p class="note">No scores in the gradebook yet for this period.</p>'}</section>
<section class="pn"><h2>NEEDS A RETAKE OR REVIEW<small>${att.length}</small></h2>${att.length?att.map(a=>`<div class="li">${a}</div>`).join(''):'<p class="note">Nobody right now.</p>'}</section>`}
function updateTab(tl){
  const c=lsGet(GH,{}),r=S.result,gok=!!ghCfg();
  const setup=S.setup?`<section class="pn nu"><h2>YOUR TEACHER LINK<small>SAVE THIS FIRST</small></h2><p class="note">This link opens these teacher tools and is the only thing that unlocks the student data. Bookmark it or store it in a password manager. If it is lost, every student link has to be reissued.</p><div class="linkbox">${E(tl)}</div><div class="bar-row"><button class="btn" data-act="copyt">Copy teacher link</button><label class="chk"><input type="checkbox" id="ack" ${S.ack?'checked':''}> I saved my teacher link</label></div></section>`:'';
  const gh=`<section class="pn"><h2>1 · GITHUB CONNECTION<small>${gok?'SAVED ON THIS COMPUTER':'OPTIONAL'}</small></h2><p class="note">Fill this in once to publish with one click. Without it you can still download <b>data.json</b> and upload it to GitHub by hand. The token is stored only in this browser.</p><div class="form"><label>GitHub username<input id="g_owner" value="${E(c.owner||'')}" autocomplete="off"></label><label>Repository name<input id="g_repo" value="${E(c.repo||'')}" autocomplete="off"></label><label>Branch<input id="g_branch" value="${E(c.branch||'main')}" autocomplete="off"></label><label>Token<input id="g_token" type="password" value="${c.token?'••••••••':''}" placeholder="paste token" autocomplete="off"></label></div><div class="bar-row"><button class="btn" data-act="savegh">Save connection</button>${c.token?'<button class="btn ghost" data-act="forget">Forget token</button>':''}</div></section>`;
  const file=`<section class="pn"><h2>2 · GRADEBOOK<small>${r?E(r.file):'NO FILE CHOSEN'}</small></h2><div class="bar-row"><button class="btn" data-act="choose">Choose gradebook…</button><button class="btn ghost" data-act="last">Use last file</button></div>${S.busy?`<p class="note">${E(S.busy)}</p>`:''}${S.err?`<p class="note err">${E(S.err)}</p>`:''}${r?summary(r):''}</section>`;
  const pub=`<section class="pn"><h2>3 · PUBLISH</h2>${r?`<div class="bar-row"><button class="btn" data-act="publish" ${(!gok||(S.setup&&!S.ack)||S.busy)?'disabled':''}>Publish to site</button><button class="btn ghost" data-act="download">Download data.json</button></div>${!gok?'<p class="note">Save a GitHub connection above to publish with one click.</p>':''}${S.setup&&!S.ack?'<p class="note">Tick “I saved my teacher link” first.</p>':''}${S.foreign?'<p class="note warn">The site already has data made with a different teacher key.</p>'+(S.setup?'<label class="chk"><input type="checkbox" id="repl" '+(S.replaceOk?'checked':'')+'> Replace it. Every old student link will stop working.</label>':''):''}${S.published?'<p class="note ok">Published. GitHub Pages usually shows the update within a couple of minutes.</p>':''}`:'<p class="note">Choose a gradebook first.</p>'}</section>`;
  return setup+gh+file+pub}
function summary(r){
  const P=r.P,w=P.warn,n=P.students.length;
  return`<div class="sum"><div class="tl"><b class="cy">${n}</b><span>STUDENTS</span></div><div class="tl"><b class="gd">${n-P.missing.length}</b><span>WITH SCORES</span></div><div class="tl"><b class="gr">${P.missing.length}</b><span>NOT IN GRADEBOOK YET</span></div><div class="tl"><b class="${r.fresh?'or':'cy'}">${r.fresh}</b><span>NEW LINKS</span></div></div>
${w.length?`<details class="warnbox"><summary>${w.length} thing${w.length>1?'s':''} to check</summary><ul>${w.slice(0,60).map(x=>`<li>${E(x)}</li>`).join('')}${w.length>60?`<li>…and ${w.length-60} more</li>`:''}</ul></details>`:'<p class="note ok">No problems found.</p>'}`}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-tab],[data-act]');if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;return paint()}
  const a=b.dataset.act,k=b.dataset.k;
  if(a==='copy'){try{await navigator.clipboard.writeText(link(k));b.textContent='Copied';setTimeout(()=>b.textContent='Copy link',1200)}catch(x){prompt('Copy this link:',link(k))}}
  else if(a==='copyc'){try{await navigator.clipboard.writeText(baseUrl());b.textContent='Copied'}catch(x){prompt('Copy this link:',baseUrl())}}
  else if(a==='openc')window.open(baseUrl(),'_blank','noopener');
  else if(a==='open')window.open(link(k),'_blank','noopener');
  else if(a==='csv')dl('student_links.csv',csv([['Student','Period','Link'],...S.teacher.students.map(s=>[s.name,s.period,link(s.key)])]),'text/csv');
  else if(a==='reissue'){S.reissue.add(b.dataset.n);paint()}
  else if(a==='copyt'){try{await navigator.clipboard.writeText(baseUrl()+'#t='+S.tkey);b.textContent='Copied'}catch(x){prompt('Copy this link:',baseUrl()+'#t='+S.tkey)}}
  else if(a==='savegh'){const old=lsGet(GH,{}),t=$('#g_token').value;lsSet(GH,{owner:$('#g_owner').value.trim(),repo:$('#g_repo').value.trim(),branch:$('#g_branch').value.trim()||'main',path:'data.json',token:t&&t!=='••••••••'?t.trim():old.token||''});S.err=null;paint()}
  else if(a==='forget'){const c=lsGet(GH,{});delete c.token;lsSet(GH,c);paint()}
  else if(a==='choose'){const f=await chooseFile();if(f)build(f)}
  else if(a==='last'){const f=await lastFile();if(f)build(f);else{S.err='No saved file yet. Choose the gradebook once and it will be remembered on this computer (Chrome or Edge).';paint()}}
  else if(a==='publish')publish();
  else if(a==='download')dl('data.json',JSON.stringify(S.result.data),'application/json');
});
document.addEventListener('change',e=>{if(e.target.id==='cper'){S.csel=e.target.value;lsSet('cq_period',S.csel);history.replaceState(null,'',cHash(S.csel,S.cme));app.innerHTML=classPage(S.cdata,S.csel,S.cme);return}if(e.target.id==='per'){S.period=e.target.value;paint()}if(e.target.id==='ack'){S.ack=e.target.checked;paint()}if(e.target.id==='repl'){S.replaceOk=e.target.checked}});
window.CQ={seal,unseal,idOf,readSheets,parseGradebook,boot};
boot();

</script></body></html>
